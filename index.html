0%;background:#111916;border:1px solid #536359;color:white;border-radius:9px;padding:8px 10px;font-weight:750;text-align:right}.chartmini{display:flex;align-items:end;gap:8px;height:75px;padding:6px 0}.chartmini .barbox{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:6px;height:100%}.chartmini .bar{width:100%;max-width:32px;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:3px}.chartmini small{color:var(--muted);font-size:9px}

<body>
  <main id="app"></main>
  <div id="toast" class="message" role="status" aria-live="polite"></div>
  <script>
  'use strict';
  const STORAGE_KEY = 'reps_gym_v1';
  const EXERCISES = {
    leg_press: { name:'Seated leg press', gear:'Leg press machine', hint:'Feet flat, move smoothly and avoid locking your knees.', rest:90, base:3, reps:10, weight:115, unit:'kg' },
    chest_press: { name:'Chest press', gear:'Chest press machine', hint:'Shoulder blades steady; push without bouncing.', rest:90, base:3, reps:10, weight:45, unit:'kg' },
    pulldown: { name:'Lat pulldown', gear:'Lat pulldown machine', hint:'Pull towards your upper chest; avoid leaning back sharply.', rest:90, base:3, reps:10, weight:45, unit:'kg' },
    row: { name:'Seated row', gear:'Plate-loaded row or cable row', hint:'Pull elbows back and pause; keep your torso stable.', rest:90, base:3, reps:10, weight:'', unit:'kg' },
    rdl: { name:'Dumbbell Romanian deadlift', gear:'Dumbbells (weight per hand)', hint:'Soft knees, hinge at the hips and keep dumbbells close to your legs. Ask a gym instructor to check your form first.', rest:90, base:2, reps:10, weight:'', unit:'kg/hand' },
    rear_delt: { name:'Rear deltoid fly', gear:'Pec deck — facing inwards', hint:'Small, controlled movement. Focus on the back of your shoulders.', rest:60, base:2, reps:10, weight:35, unit:'kg' },
    pec_fly: { name:'Pec fly', gear:'Pec deck — facing outwards', hint:'Control the return and avoid forcing a deep shoulder stretch.', rest:60, base:2, reps:10, weight:35, unit:'kg' },
    triceps: { name:'Rope triceps pushdown', gear:'Cable machine + rope', hint:'Keep elbows close to your sides; move through the elbows.', rest:60, base:2, reps:10, weight:'', unit:'kg' },
    curls: { name:'Dumbbell bicep curls', gear:'Dumbbells (weight per hand)', hint:'Elbows still, no swinging. Choose a weight you can control.', rest:60, base:2, reps:10, weight:'', unit:'kg/hand' }
  };
  const PLANS = {
    A:['leg_press','chest_press','pulldown','rdl','rear_delt','triceps'],
    B:['leg_press','row','chest_press','pulldown','rdl','pec_fly','curls']
  };
  const DEFAULT = () => ({
    settings:{ comeback:true, warmup:6, cardio:15, incline:2, bigRest:90, smallRest:60, sound:true },
    weights:Object.fromEntries(Object.entries(EXERCISES).map(([id,x]) => [id,x.weight])),
    planned:{}, planSets:{A:{},B:{}}, checkins:{}, sessions:[], measurements:[], active:null
  });
  function load() {
    let saved;
    try { saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null'); } catch { saved=null; }
    const d=DEFAULT();
    if(!saved || typeof saved!=='object')return d;
    return {
      settings:{...d.settings,...(saved.settings||{})},
      weights:{...d.weights,...(saved.weights||{})},
      planned:saved.planned&&typeof saved.planned==='object'?saved.planned:{},
      planSets:{A:{...(saved.planSets?.A||{})},B:{...(saved.planSets?.B||{})}},
      checkins:saved.checkins&&typeof saved.checkins==='object'?saved.checkins:{},
      sessions:Array.isArray(saved.sessions)?saved.sessions:[],
      measurements:Array.isArray(saved.measurements)?saved.measurements:[],
      active:saved.active&&Array.isArray(saved.active.steps)?saved.active:null
    };
  }
  let state=load(), view='today', planTab='A', planEditorOpen=false, expandedHistory=null, justFinishedId=null, showMeasureForm=false, toastTimer;
  let timerTick=null;
  function save(){ try {localStorage.setItem(STORAGE_KEY,JSON.stringify(state));} catch { toast('Could not save — storage may be full'); } }
  const $=s=>document.querySelector(s);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtN=n=>(Math.round(n*100)/100).toString();
  const fmtTime=n=>{ const s=Math.max(0,Math.ceil(n));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; };
  function localDate(d=new Date()){const yyyy=d.getFullYear(),mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${yyyy}-${mm}-${dd}`;}
  function startOfDay(date){return new Date(date.getFullYear(),date.getMonth(),date.getDate());}
  function daysBetween(a,b){return Math.round((Date.UTC(a.getFullYear(),a.getMonth(),a.getDate())-Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()))/86400000);}
  function weekIndex(d=new Date()){ const day=(d.getDay()+6)%7;const mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day);return Math.floor(daysBetween(mon,new Date(2026,10,23))/7); }
  function scheduled(d=new Date()){ const day=d.getDay();if(![1,3,5].includes(day))return null; const odd=(((weekIndex(d)%2)+2)%2)===1; const value=odd?{1:'B',3:'A',5:'B'}:{1:'A',3:'B',5:'A'};return value[day]; }
  function nextWorkoutDate(){let d=startOfDay(new Date());for(let i=0;i<8;i++){if(scheduled(d)&&!state.sessions.some(s=>s.date===localDate(d)))return d;d.setDate(d.getDate()+1);}return d;}
  function fmtDate(v){return new Date(`${v}T12:00:00`).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}
  function fmtFullDate(v){return new Date(`${v}T12:00:00`).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
  function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800);}

  function navbar(){const arr=[['today','Today','home'],['plan','My plan','plan'],['coach','Coach','coach'],['history','History','history'],['settings','Settings','settings']];return `<nav class="nav" aria-label="Main navigation"><div class="nav-inner">${arr.map(([id,label,ic])=>`<button type="button" data-nav="${id}" class="${view===id?'active':''}" aria-current="${view===id?'page':'false'}">${icon(ic)}<span>${label}</span></button>`).join('')}</div></nav>`;}

  // Coaching is rule-based guidance from logged training, not a muscle-growth measurement.
  function strengthHistory(id){

  function readiness(){

  function coachAdvice(id){

    if(!history.length)return {...base,status:'new',label:'Start logging',text:'No completed sets yet. Record your weights, reps and effort for a couple of workouts to unlock personalised advice.',last:'No sessions yet'};
    const step=history.at(-1).step,load=stableLoad(step);

    if(readiness().state==='caution')return {...base,status:'hold',label:'Recovery first',text:readiness().text,last};
    const recent=history.slice(-2);
    const matched=recent.length===2&&recent.every(x=>fullStrength(x.step)&&stableLoad(x.step)===load);
    const safe=matched&&recent.every(x=>x.step.effort!=='hard'&&x.step.sets.every(set=>Number(set.reps)>=target));
    const excellent=safe&&recent.every(x=>x.step.sets.every(set=>Number(set.reps)>=target+2));
    const easy=safe&&recent.every(x=>x.step.effort==='easy');
    if(excellent||easy){
      if(state.settings.comeback)return {...base,status:'build',label:'Strong comeback',text:'Two consistent workouts at '+fmtN(load)+' '+unit+'. Stay at this weight during Comeback mode; increase only after you are recovering comfortably.',last};
      return {...base,status:'ready',label:'Ready to increase',text:'Two consistent full workouts at '+fmtN(load)+' '+unit+'. If your form is controlled, try the smallest available weight increase next time; it is optional.',last};
    }
    if(step.effort==='easy'&&history.length===1)return {...base,status:'build',label:'Looking promising',text:'That weight felt easy. Repeat it for another complete session before moving up.',last};
    return {...base,status:'build',label:'Build your reps',text:'Stay at '+fmtN(load)+' '+unit+'. Try to add a controlled repetition to a set when comfortable, working towards '+(target+2)+' reps per set.',last};

  function trainingXP(){
    const sessions=state.sessions.filter(s=>s?.finishedAt).slice().sort((a,b)=>a.finishedAt-b.finishedAt);

    for(const session of sessions){
      if((session.steps||[]).some(x=>x.done||x.sets?.some(y=>y.completed)))xp+=30;
      for(const step of session.steps||[]){
        if(step.type==='strength')for(const set of step.sets||[]){

  function exerciseTrend(id){

    if(action==='prev'&&s&&s.stepIndex>0){s.stepIndex--;s.rest=null;s.timer=null;save();render();scrollTop();return;}
    if(action==='skip'&&s){if(!confirm(`Skip ${step.title}? You can return to it from the workout list.`))return;step.skipped=true;s.rest=null;s.timer=null;return getStepAfter();}
    if(action==='jump'&&s){s.stepIndex=Number(el.dataset.step);s.rest=null;s.timer=null;save();render();scrollTop();return;}
    if(action==='end'&&s){if(!confirm('Finish and save this workout now, even if it is incomplete?'))return;finishWorkout();return;}
    if(action==='toggle-measure'){showMeasureForm=!showMeasureForm;render();return;}
    if(action==='save-measure'){const a=$('#bodyweight').value,b=$('#waist').value;if(!a&&!b){toast('Enter a weight or waist measurement');return;}if((a&&(Number(a)<20||Number(a)>400))||(b&&(Number(b)<20||Number(b)>250))){toast('Please check the values');return;}state.measurements.push({date:localDate(),weight:a?Number(a):null,waist:b?Number(b):null});save();showMeasureForm=false;render();toast('Measurement saved');return;}
    if(action==='delete-history'){if(!confirm('Delete this workout permanently?'))return;state.sessions=state.sessions.filter(x=>x.id!==el.dataset.id);expandedHistory=null;save();render();return;}
    if(action==='export'){const blob=new Blob([JSON.stringify({app:'REPS',version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`reps-backup-${localDate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup downloaded');return;}
  }
  document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){e.preventDefault();if(view==='today'&&state.active&&n.dataset.nav!=='today'){for(const kind of ['rest','timer']){const t=state.active[kind];if(t&&!t.paused){t.left=remaining(t);t.paused=true;}}save();}view=n.dataset.nav;if(view!=='history')justFinishedId=null;render();scrollTop();return;}const p=e.target.closest('[data-plan]');if(p){planTab=p.dataset.plan;render();return;}const h=e.target.closest('[data-history]');if(h){expandedHistory=expandedHistory===h.dataset.history?null:h.dataset.history;render();return;}const a=e.target.closest('[data-action]');if(a){handleAction(a.dataset.action,a);return;}});
  document.addEventListener('change',async e=>{const el=e.target;if(el.matches('[data-setting]')){const key=el.dataset.setting;const isBool=el.type==='checkbox';let value=isBool?el.checked:Number(el.value);if(!isBool){const min=Number(el.min),max=Number(el.max);if(!Number.isFinite(value))value=state.settings[key];value=Math.min(max,Math.max(min,value));}state.settings[key]=value;save();render();toast('Settings saved');return;}if(el.matches('[data-plan-sets]')){
      const id=el.dataset.planSets,variant=el.dataset.variant;
      const raw=el.value.trim(),n=Number(raw);
      if(!PLANS[variant]?.includes(id)||raw===''||!Number.isInteger(n)||n<1||n>6){
        toast('Enter 1–6 sets');render();return;
      }
      state.planSets[variant]={...(state.planSets[variant]||{}),[id]:n};
      save();render();toast('Workout '+variant+': '+n+' sets saved');return;
    }
    if(el.matches('[data-plan-weight], [data-plan-reps]')){
      const isWeight=el.hasAttribute('data-plan-weight');
      const id=isWeight?el.dataset.planWeight:el.dataset.planReps;
      if(!EXERCISES[id])return;
      const val=el.value.trim(), n=Number(val);
      if(isWeight?(val!==''&&(!Number.isFinite(n)||n<0||n>1000)):(!Number.isInteger(n)||n<1||n>100)){
        toast('Check the weight or reps value');render();return;
      }
      state.planned[id]={...(state.planned[id]||{}),[isWeight?'weight':'reps']:isWeight&&val===''?'':n};
      save();render();toast('Workout target saved');return;
    }
    if(el.matches('[data-weight]')){const val=el.value.trim();if(val!==''&&(!Number.isFinite(Number(val))||Number(val)<0||Number(val)>1000)){toast('Please enter a valid weight');render();return;}state.weights[el.dataset.weight]=val===''?'':Number(val);save();return;}if(el.matches('#importFile')&&el.files?.length){try{const raw=await el.files[0].text(),obj=JSON.parse(raw);if(obj.app!=='REPS'||!Array.isArray(obj.sessions)||!obj.settings||!obj.weights){toast('Not a valid REPS backup');return;}if(!confirm('Importing will replace all current progress on this device. Continue?'))return;const d=DEFAULT();state={settings:{...d.settings,...obj.settings},weights:{...d.weights,...obj.weights},planned:obj.planned&&typeof obj.planned==='object'?obj.planned:{},planSets:{A:{...(obj.planSets?.A||{})},B:{...(obj.planSets?.B||{})}},checkins:obj.checkins&&typeof obj.checkins==='object'?obj.checkins:{},sessions:obj.sessions,measurements:Array.isArray(obj.measurements)?obj.measurements:[],active:obj.active&&Array.isArray(obj.active.steps)?obj.active:null};save();render();toast('Backup restored');}catch{toast('Could not read this backup file');}}});
  document.addEventListener('input',e=>{const step=stepData();if(state.active&&step?.type==='strength'){if(e.target.id==='weight'){step.draftWeight=e.target.value;save();}if(e.target.id==='reps'){step.draftReps=e.target.value;save();}}});
  window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['today','plan','coach','history','settings'].includes(v)){view=v;render();}});
  if(['today','plan','coach','history','settings'].includes(location.hash.slice(1)))view=location.hash.slice(1);
  render();timerTick=setInterval(tick,300);
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  </script>
</body>
</html>
