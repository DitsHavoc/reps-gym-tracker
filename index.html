    /* REPS UX refresh: emphasis on one clear action per screen */
    :root{--bg:#0e1412;--panel:#1a231f;--panel2:#243129;--line:#344139;--muted:#a6b7ac;--accent:#c2f270}
    body{background:radial-gradient(circle at 50% -280px,#273c2c 0,transparent 490px),var(--bg);letter-spacing:.005em}
    #app{max-width:680px;padding-left:18px;padding-right:18px;padding-bottom:calc(108px + env(safe-area-inset-bottom))}
    header{padding-top:21px;padding-bottom:15px}
    .brandmark{background:var(--accent);box-shadow:0 8px 28px #c2f27019}
    h1{letter-spacing:-1.3px}
    h2{letter-spacing:-.6px}
    .page-intro{margin:7px 0 19px}
    .page-intro h1{font-size:clamp(32px,8vw,40px);margin-bottom:6px}
    .page-intro .eyebrow{margin:9px 0 8px}
    .page-intro .small{margin-bottom:0}
    .btn{border-radius:13px;font-weight:780}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#111e16;box-shadow:0 5px 14px #b9f2680b}
    .btn.primary:active{background:#a9d55e}
    .btn.big{min-height:56px}
    .panel{border-color:#354038;background:#1a231f;border-radius:16px}
    .sectionhead{margin:24px 0 11px}
    .text-link{appearance:none;background:none;border:0;color:var(--accent);padding:5px 0;font-size:13px;font-weight:750;text-align:left;cursor:pointer}
    .text-link:focus-visible,.edit-toggle:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .home-hero{padding:24px 20px 19px;background:linear-gradient(150deg,#2b4934 0%,#1a3024 64%,#18261e 100%);border-color:#54784c;box-shadow:0 13px 42px #040b072b}
    .home-hero h2{font-size:clamp(46px,12vw,60px);line-height:1.02;letter-spacing:-2.7px;margin:20px 0 12px;font-weight:900}
    .home-hero .sub{font-size:14px;line-height:1.6;margin-bottom:24px}
    .hero-secondary{display:block;margin:9px auto 0;color:#d6ecca;font-size:12px;text-align:center}
    .home-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
    .home-metrics>div{background:#19231f;border:1px solid #2e3d33;border-radius:15px;padding:15px}
    .home-metrics strong{display:block;font-size:25px;letter-spacing:-.5px;margin-top:4px}
    .home-metrics strong small{font-size:12px;letter-spacing:normal;color:var(--muted);font-weight:600}
    .coach-preview{border:1px solid #3f5641;background:#243429;display:flex;align-items:center;gap:12px;padding:14px;text-align:left;width:100%;border-radius:16px;color:#f5faf3;cursor:pointer}
    .coach-preview-icon{display:grid;place-items:center;width:38px;height:38px;flex:0 0 38px;background:#bdf06f23;border-radius:11px;color:var(--accent);font-size:24px}
    .coach-preview-copy{min-width:0;flex:1}
    .coach-preview-copy strong{display:block;font-size:14px;margin-bottom:3px}
    .coach-preview-copy small{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:12px;line-height:1.45;color:#b9cdbb}
    .coach-preview>span:last-child{font-size:28px;color:var(--accent)}
    .disclosure{border:1px solid #35453b;background:#19221e;border-radius:14px;margin:13px 0;overflow:hidden}
    .disclosure>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:15px 16px;cursor:pointer;list-style:none;font-size:14px;font-weight:760}
    .disclosure>summary::-webkit-details-marker{display:none}
    .disclosure>summary>span{color:var(--muted);font-size:11px;font-weight:650;margin-left:auto}
    .disclosure>summary:after{content:'⌄';color:var(--accent);font-size:18px;line-height:1;transition:transform .16s}
    .disclosure[open]>summary:after{transform:rotate(180deg)}
    .disclosure[open]>summary{border-bottom:1px solid #35453b}
    .disclosure>.panel{border:0;margin:0;background:#1a241f;border-radius:0}
    .disclosure>.timeline,.disclosure>.logged-list,.disclosure>div:not(.panel){padding:12px}
    .disclosure>.timeline .line{margin-bottom:8px}
    .disclosure>.timeline .line:last-child{margin-bottom:0}
    .disclosure .exercise-item:first-child{padding-top:8px}
    .disclosure .exercise-item:last-child{padding-bottom:9px}
    .plan-start{border-radius:18px;background:#22352a;border:1px solid #46634a;padding:20px;margin:13px 0}
    .plan-start h2{font-size:34px;font-weight:870;margin:6px 0}

        .map(s=>(s.steps||[]).find(x=>x.type==='strength'&&x.id===step.id))
        .find(x=>x&&(x.sets||[]).some(y=>y.completed));
      if(!previous)continue;
      const old=(previous.sets||[]).filter(x=>x.completed&&Number(x.weight)>0);
      if(!old.length)continue;
      const curMax=Math.max(...current.map(x=>Number(x.weight))),oldMax=Math.max(...old.map(x=>Number(x.weight)));
      const sameLoad=current.every(x=>Number(x.weight)===oldMax)&&old.every(x=>Number(x.weight)===oldMax);
      const newReps=current.reduce((v,x)=>v+Number(x.reps),0),oldReps=old.reduce((v,x)=>v+Number(x.reps),0);
      if((curMax>oldMax&&current.every(x=>Number(x.reps)>=6))||(sameLoad&&current.length===old.length&&newReps>oldReps))
        improved.push({name:step.title,detail:curMax>oldMax?'Heavier weight':'More reps at same weight'});
    }
    return {sets:completed.length,cardio,duration,best,improved,volume:totalVolume(session)};

  function trainingXP(){
    const sessions=state.sessions.filter(s=>s?.finishedAt).slice().sort((a,b)=>a.finishedAt-b.finishedAt);
    let xp=0,records=0;const best={};
    for(const session of sessions){
      if((session.steps||[]).some(x=>x.done||x.sets?.some(y=>y.completed)))xp+=30;
      for(const step of session.steps||[]){
        if(step.type==='strength')for(const set of step.sets||[]){
          if(!set.completed)continue;
          xp+=10;
          const kg=Number(set.weight);
          if(kg>0&&Number(set.reps)>=6&&kg>(best[step.id]||0)){best[step.id]=kg;records++;xp+=15;}
        }
        if(step.id==='cardio'&&step.done)xp+=15;
      }
    }
    return {xp,level:1+Math.floor(xp/250),progress:xp%250,next:250-xp%250,records};
  }
  function exerciseTrend(id){
    if(timedExercise(id)){
      const timed=strengthHistory(id).slice(-2);
      if(timed.length<2)return 'More holds needed for a trend';
      const peak=x=>Math.max(...x.step.sets.filter(y=>y.completed).map(y=>Number(y.reps)||0));
      return peak(timed[1])>peak(timed[0])?'Improving — longer plank hold':peak(timed[1])===peak(timed[0])?'Maintaining — steady hold':'Shorter hold — focus on form';
    }
    const recent=strengthHistory(id).filter(x=>fullStrength(x.step)).slice(-2);
    if(recent.length<2)return 'More sessions needed for a trend';
    const a=recent[0].step,b=recent[1].step;
    const first=stableLoad(a),second=stableLoad(b);
    if(first===null||second===null)return 'Mixed training loads — no direct comparison';
    const avg=x=>x.sets.reduce((sum,set)=>sum+Number(set.reps),0)/x.sets.length;
    const aReps=avg(a),bReps=avg(b);
    if(second>first&&bReps>=Math.min(aReps,targetReps(id)))return 'Improving — heavier working weight';
    if(first===second&&bReps>aReps+0.25)return 'Improving — more reps at the same weight';
    if(first===second&&Math.abs(aReps-bReps)<=0.25)return 'Maintaining — consistent performance';
    if(first===second&&bReps<aReps-0.25)return 'Tougher session — no increase needed';
    return 'Changing loads — keep logging for a trend';
  }

    return target+1;
  }

    if(count<completed)return false;

    if(count<current&&step.sets.slice(count).some(x=>x.completed))return false;
    while(step.sets.length<count)step.sets.push({weight:'',reps:step.targetReps,completed:false});

  function historyEditRow(session,step,stepIndex,set,setIndex){
    const id=session.id,editing=editingHistory?.sessionId===id&&editingHistory?.stepIndex===stepIndex&&editingHistory?.setIndex===setIndex;

      <button class="btn ghost smallbtn history-edit-btn" data-action="edit-history-set" data-session="${esc(id)}" data-step="${stepIndex}" data-set="${setIndex}" aria-label="Edit logged set for ${esc(step.title)}">Edit</button></td></tr>`;

        <div class="field"><label for="history-edit-reps">${timed?'Seconds held':'Repetitions'}</label><input id="history-edit-reps" type="number" min="1" max="${timed?300:100}" step="1" inputmode="numeric" value="${esc(set.reps)}"></div>

  }
  function historyItem(s){

    </button>${expanded?`<div class="history-details"><p class="tiny muted">Use Edit beside a set to correct a logging mistake. Your other sets and sessions are untouched.</p>
    <div class="history-table-wrap"><table><thead><tr><th>Exercise</th><th>Weight</th><th>Reps / hold</th></tr></thead><tbody>
    ${(s.steps||[]).map((x,si)=>x.type==='strength'?(x.sets||[]).map((set,i)=>set.completed?historyEditRow(s,x,si,set,i):'').join(''):`<tr><td>${esc(x.title)}</td><td colspan="2">${x.done?(x.actual?.minutes??x.minutes)+' min'+(x.id==='cardio'?', '+(x.actual?.incline??x.incline)+'% incline'+(x.actual?.speed?' @ '+x.actual.speed+' km/h':''):''):'Not completed'}</td></tr>`).join('')}
    </tbody></table></div>
    <button class="btn danger smallbtn" style="margin-top:12px" data-action="delete-history" data-id="${esc(s.id)}">Delete this workout</button></div>`:''}`;
  }
  function settingsView(){return `<p class="eyebrow">Make it yours</p><h1>Settings.</h1><p class="small muted">Your timer, weights and training phase. Changes are saved automatically.</p><div class="panel"><h3>Training</h3>

    ${settingNumber('Warm-up treadmill','warmup',state.settings.warmup,'minutes',3,20,1)}

      <p class="tiny muted" style="margin:4px 16px 0 0">Can notify when a rest ends while the app is running. Android may delay notifications if the browser is suspended; not guaranteed on a locked phone.</p>

    ${settingSwitch('Optional protein check-in','Show one gentle daily protein tick on Today. No timed alerts or supplement reminders.','proteinCheck',!!state.settings.proteinCheck)}</div>
    <details class="disclosure"><summary>Default starting weights</summary><div class="panel"><p class="small muted">Your last logged weight is suggested first. These are editable starting values, <strong>not targets you must reach</strong>. Dumbbell values are per hand; planks are timed.</p>${Object.entries(EXERCISES).filter(([id])=>!timedExercise(id)&&(PLANS.A.includes(id)||PLANS.B.includes(id)||id==='db_chest_press'||strengthHistory(id).length)).map(([id,x])=>`<div class="weightrow"><div class="small"><strong>${esc(x.name)}</strong><div class="tiny muted">${x.unit}</div></div><input aria-label="Starting weight for ${esc(x.name)}" data-weight="${id}" type="number" min="0" max="1000" step="0.5" inputmode="decimal" placeholder="—" value="${esc(state.weights[id])}" /></div>`).join('')}</div></details>
    ${sectionTitle('Back up your progress')}<div class="panel"><p class="small muted">Your data is stored on this device, not automatically in the cloud. Download a backup or share one to Google Drive from your phone. Save a new backup occasionally.</p><div class="flexwrap"><button class="btn primary" data-action="export">${icon('download')} Download backup</button><button class="btn ghost" data-action="share-backup">Share / save to Drive</button><label class="btn ghost" for="importFile" style="cursor:pointer">Import backup</label><input id="importFile" type="file" accept=".json,application/json" hidden /></div></div>

  function settingSwitch(label,desc,key,v){return `<div class="setting-row row"><div><strong class="small">${label}</strong><p class="tiny muted" style="margin:4px 16px 0 0">${desc}</p></div><input type="checkbox" class="toggle" role="switch" aria-label="${label}" data-setting="${key}" ${v?'checked':''}></div>`;}
  function settingNumber(label,key,value,unit,min,max,step){return `<div class="setting-row row"><div><strong class="small">${label}</strong><div class="tiny muted">${unit}</div></div><div class="field"><input type="number" aria-label="${label}" data-setting="${key}" value="${value}" min="${min}" max="${max}" step="${step}" inputmode="decimal"></div></div>`;}
  function render(){const main=$('#app');main.innerHTML=header()+(view==='today'?todayView():view==='plan'?planView():view==='coach'?coachView():view==='history'?historyView():settingsView())+navbar();tick();syncWakeLock();}
  function startWorkout(variant){
    if(!state.active){if(!PLANS[variant])return;state.active=newSession(variant);save();}
    view='today';render();scrollTop();
  }
  function validDumbbellEntry(step,weight){
    if(EXERCISES[step.id]?.unit!=='kg/hand'||weight<=30)return true;
    if(step.confirmedHighDumbbellWeight===weight)return true;
    if(!confirm('Dumbbell weights are entered PER HAND. You entered '+fmtN(weight)+' kg. For two 20 kg dumbbells, enter 20, not 40. Is '+fmtN(weight)+' kg in EACH hand correct?')){
      toast('Please enter the weight of one dumbbell');return false;
    }
    step.confirmedHighDumbbellWeight=weight;
    return true;
  }
  function saveActiveSet(data){
    const s=state.active,step=stepData();
    if(!s||step?.type!=='strength')return false;
    const index=currentSet(step);if(index<0)return false;
    const weight=Number(data.weight),reps=Number(data.reps);
    if(!Number.isFinite(weight)||weight<0||weight>1000||!Number.isInteger(reps)||reps<1||reps>(timedExercise(step.id)?300:100))return false;
    if(!validDumbbellEntry(step,weight))return false;
    step.sets[index]={weight:timedExercise(step.id)?0:weight,reps,completed:true};
    if(timedExercise(step.id))s.timer=null;
    step.draftWeight=weight;step.draftReps=reps;state.weights[step.id]=weight;
    state.planned[step.id]={...state.planned[step.id],weight};
    if(index===step.sets.length-1){
      step.done=true;
      if(s.stepIndex<s.steps.length-1){
        getStepAfter(true);
        toast('Exercise complete — 60-second break started');
      }else{save();render();scrollTop();toast('All sets done');}
    }
    else{save();startClock('rest',step.id,restSeconds(step.id));scrollTop();}
    return true;
  }
  function readSetInput(weightSelector='#weight',repsSelector='#reps'){const step=stepData();if(!step)return null;const weightEl=$(weightSelector),repsEl=$(repsSelector);if(!weightEl||!repsEl)return null;const weight=weightEl.value.trim(),reps=repsEl.value.trim();if(weight===''||!Number.isFinite(Number(weight))||Number(weight)<0||Number(weight)>1000){toast('Enter a valid weight (0 is fine for bodyweight)');weightEl.focus();return null;}if(!Number.isInteger(Number(reps))||Number(reps)<1||Number(reps)>(timedExercise(step.id)?300:100)){toast(timedExercise(step.id)?'Enter a hold from 1–300 seconds':'Enter a valid repetition count');repsEl.focus();return null;}return{weight:Number(weight),reps:Number(reps)};}
  function handleAction(action,el){let s=state.active,step=stepData();
    if(action==='edit-history-set'){
      const session=state.sessions.find(x=>x.id===el.dataset.session);
      const si=Number(el.dataset.step),i=Number(el.dataset.set);
      if(!session||!Number.isInteger(si)||!Number.isInteger(i)||session.steps?.[si]?.type!=='strength'||!session.steps[si].sets?.[i]?.completed)return;
      expandedHistory=session.id;editingHistory={sessionId:session.id,stepIndex:si,setIndex:i};
      render();return;
    }
    if(action==='cancel-history-edit'){editingHistory=null;render();return;}
    if(action==='save-history-set'){
      if(!editingHistory)return;
      const session=state.sessions.find(x=>x.id===editingHistory.sessionId),entry=session?.steps?.[editingHistory.stepIndex];
      const set=entry?.sets?.[editingHistory.setIndex];
      if(!set?.completed||entry.type!=='strength'||!EXERCISES[entry.id])return;
      const timed=timedExercise(entry.id),kg=timed?0:Number($('#history-edit-weight')?.value);
      const reps=Number($('#history-edit-reps')?.value);
      if(!Number.isFinite(kg)||kg<0||kg>1000||!Number.isInteger(reps)||reps<1||reps>(timed?300:100)){
        toast('Check the weight and reps before saving');return;
      }
      if(!timed&&EXERCISES[entry.id].unit==='kg/hand'&&kg>30&&!confirm('Please confirm '+fmtN(kg)+' kg is in EACH hand, not combined. Continue?'))return;
      const changeTarget=!timed&&$('#history-use-next')?.checked===true;
      if(kg===Number(set.weight)&&reps===Number(set.reps)&&!changeTarget){editingHistory=null;render();return;}
      if(!createSafetyCopy('Before correcting a completed workout')){toast('Could not save a recovery copy; correction cancelled');return;}
      if(kg!==Number(set.weight)||reps!==Number(set.reps)){
        const old={weight:set.weight,reps:set.reps,changedAt:Date.now()};
        set.corrections=[...(set.corrections||[]),old];
        set.weight=kg;set.reps=reps;
      }
      if(changeTarget){state.planned[entry.id]={...(state.planned[entry.id]||{}),weight:kg};state.weights[entry.id]=kg;}
      editingHistory=null;save();render();
      toast(changeTarget?'Set corrected; next workout weight updated':'Set corrected; future targets unchanged');return;
    }
    if(action==='accept-coach-reps'){
      const id=el.dataset.id,requested=Number(el.dataset.reps);
      if(proposedRepTarget(id)!==requested||!Number.isInteger(requested)){
        toast('Rep suggestion has changed — check your latest sets');render();return;
      }
      state.planned[id]={...(state.planned[id]||{}),reps:requested};
      if(s&&step?.type==='strength'&&step.id===id&&currentSet(step)>=0){
        step.targetReps=requested;
        for(const pending of step.sets)if(!pending.completed)pending.reps=requested;
        step.draftReps=requested;
      }
      save();render();toast('Target changed to '+requested+' reps. Completed sets remain unchanged.');return;
    }
    if(action==='accept-coach-weight'){
      const id=el.dataset.id,requested=Number(el.dataset.weight);
      if(!EXERCISES[id]||timedExercise(id))return;
      // Recalculate from finished logs so a stale rendered button cannot apply old advice.
      const advice=coachAdvice(id);
      if(advice.status!=='ready'||!Number.isFinite(requested)||advice.proposedWeight!==requested){
        toast('Recommendation has changed — review your latest results');render();return;
      }
      state.planned[id]={...(state.planned[id]||{}),weight:requested};
      state.weights[id]=requested;
      save();render();toast('Next workout target updated to '+fmtN(requested)+' '+EXERCISES[id].unit+'. Your workout history was not changed.');return;
    }
    if(action==='back-plan'||action==='save-exit'){
      if(s){
        for(const kind of ['rest','timer','exerciseBreak']){
          const timer=s[kind];
          if(timer&&!timer.paused){
            timer.left=remaining(timer);
            timer.paused=true;
          }
        }
      }
      save();
      view='plan';render();scrollTop();
      if(s)toast('Workout saved — return to Today to resume');
      return;
    }
    if((action==='increase-active-sets'||action==='decrease-active-sets')&&s&&step?.type==='strength'){
      const count=step.targetSets+(action==='increase-active-sets'?1:-1);
      if(!resizeStrengthSets(step,count)){toast('Cannot remove a completed set or exceed 6 sets');return;}
      step.manualSets=true;
      state.planSets[s.variant]={...(state.planSets[s.variant]||{}),[step.id]:count};
      save();render();toast(count+' sets saved for Workout '+s.variant);return;
    }
    if(action==='swap-exercise'&&s&&step?.type==='strength'){
      const next=el.dataset.swap;
      if(!SWAPS[step.id]||SWAPS[step.id]!==next||!EXERCISES[next]||step.sets.some(x=>x.completed)){
        toast('Swap only before you have logged sets');return;
      }
      if(step.swappedFrom===next)delete step.swappedFrom;
      else if(!step.swappedFrom)step.swappedFrom=step.id;
      step.id=next;step.title=EXERCISES[next].name;step.effort=null;
      step.draftWeight=bestWeight(next);step.draftReps=targetReps(next);
      step.targetReps=targetReps(next);
      step.sets=Array.from({length:step.targetSets},()=>({weight:'',reps:step.targetReps,completed:false}));
      s.rest=null;s.editingSet=null;
      save();render();toast('Exercise swapped for this workout');return;
    }
    if(action==='make-active-three'&&s){
      let adjusted=0;
      for(const x of s.steps){
        if(x.type!=='strength'||timedExercise(x.id)||x.targetSets>=3||(x.done&&x!==step))continue;
        if(resizeStrengthSets(x,3)){
          adjusted++;x.manualSets=true;
          state.planSets[s.variant]={...(state.planSets[s.variant]||{}),[x.id]:3};
        }
      }
      save();render();toast(adjusted?adjusted+' exercises updated to 3 sets':'All exercises already have at least 3 sets');return;
    }
    if(action==='rate-effort'&&s){
      const effort=el.dataset.effort,index=Number(el.dataset.effortStep);
      const rated=s.steps?.[index];
      if(!['easy','good','hard'].includes(effort)||!Number.isInteger(index)||!rated||rated.type!=='strength'||!fullStrength(rated))return;
      rated.effort=effort;save();render();toast('Effort recorded');return;
    }
    if(action==='toggle-alerts'){
      if(state.settings.restAlerts){state.settings.restAlerts=false;save();render();return;}
      if(!('Notification' in window)||!('serviceWorker' in navigator)||!window.isSecureContext){toast('Notifications not supported here');return;}
      try{
        Notification.requestPermission().then(permission=>{
          state.settings.restAlerts=permission==='granted';
          save();render();toast(state.settings.restAlerts?'Rest notifications enabled':'Notifications not enabled');
        }).catch(()=>toast('Could not request notifications'));
      }catch{toast('Notification permission unavailable');}
      return;
    }
    if(action==='backup-later'){
      state.backupRemindedAt=Date.now();save();render();return;
    }
    if(action==='toggle-protein'){
      if(!state.settings.proteinCheck)return;
      const date=localDate();
      state.proteinDays[date]=state.proteinDays[date]!==true;
      save();render();toast(state.proteinDays[date]?'Protein check-in done':'Protein check-in reset');return;
    }
    if(action==='save-checkin'){
      const energy=Number($('#check-energy')?.value),soreness=Number($('#check-soreness')?.value),sleep=Number($('#check-sleep')?.value);
      if(![energy,soreness,sleep].every(x=>Number.isInteger(x)&&x>=1&&x<=5)){toast('Choose energy, soreness and sleep');return;}
      state.checkins[localDate()]={energy,soreness,sleep};save();render();toast('Check-in saved');return;
    }
    if(action==='toggle-plan-editor'){planEditorOpen=!planEditorOpen;render();return;}
    if(action==='start')return startWorkout(el.dataset.variant);
    if(action==='set-all-3'||action==='reset-plan-sets'){
      const variant=el.dataset.variant;
      if(!PLANS[variant])return;
      if(action==='set-all-3')state.planSets[variant]={...(state.planSets[variant]||{}),...Object.fromEntries(PLANS[variant].filter(id=>!timedExercise(id)).map(id=>[id,3]))};
      else state.planSets[variant]={};
      save();render();toast(action==='set-all-3'?'Workout '+variant+': 3 sets on lifts (plank unchanged)':'Workout '+variant+': suggested sets restored');return;
    }
    if(action==='edit-set'&&s&&step?.type==='strength'){
      const index=Number(el.dataset.index);
      if(!step.sets[index]?.completed)return;
      s.editingSet={stepId:step.id,index};
      save();render();return;
    }
    if(action==='cancel-edit-set'&&s){s.editingSet=null;save();render();return;}
    if(action==='save-edit-set'&&s&&step?.type==='strength'){
      const index=Number(el.dataset.index);
      if(!step.sets[index]?.completed)return;
      const data=readSetInput('#edit-weight','#edit-reps');
      if(!data||!validDumbbellEntry(step,data.weight))return;
      step.sets[index]={...data,completed:true};
      s.editingSet=null;
      state.weights[step.id]=data.weight;
      state.planned[step.id]={...state.planned[step.id],weight:data.weight};
      save();render();toast('Set updated');return;
    }
    if(action==='adjust-set-input'&&s&&step?.type==='strength'&&!s.rest){
      const field=el.dataset.field;
      if(!['weight','reps'].includes(field))return;
      const delta=Number(el.dataset.delta),input=$('#'+field);
      if(!input||!Number.isFinite(delta))return;
      const current=Number(input.value)||0;
      const next=field==='reps'?Math.min(timedExercise(step.id)?300:100,Math.max(1,current+delta)):
        Math.min(1000,Math.max(0,Math.round((current+delta)*100)/100));
      input.value=String(next);
      if(field==='weight')step.draftWeight=next;
      else step.draftReps=next;
      save();return;
    }
    if(action==='repeat-last-set'&&s&&step?.type==='strength'&&!s.rest){
      const prior=step.sets.slice().reverse().find(x=>x.completed);
      if(prior)saveActiveSet(prior);
      return;
    }
    if(action==='logset'&&s&&step?.type==='strength'){
      const data=readSetInput();if(data)saveActiveSet(data);return;
    }
    if(action==='undo-set'&&s&&step?.type==='strength'){s.editingSet=null;const idx=step.sets.map((x,i)=>x.completed?i:-1).filter(x=>x>=0).pop();if(idx===undefined)return;step.sets[idx].completed=false;step.done=false;s.rest=null;save();render();return;}
    if(action==='next'&&s)return getStepAfter(true);
    if(action==='toggle-exercise-break'&&s?.exerciseBreak)return toggleClock('exerciseBreak');
    if(action==='add-exercise-break'&&s?.exerciseBreak){
      const t=s.exerciseBreak;
      if(t.paused)t.left=Math.min(1200,t.left+30);
      else t.until=Date.now()+Math.min(1200,remaining(t)+30)*1000;
      save();render();return;
    }
    if(action==='skip-exercise-break'&&s?.exerciseBreak){
      s.exerciseBreak=null;save();render();toast('Next exercise ready');return;
    }
    if(action==='preset-rest'&&s&&s.rest){
      const seconds=Number(el.dataset.seconds);
      if(![60,90,120].includes(seconds))return;
      if(s.rest.paused)s.rest.left=seconds;
      else s.rest.until=Date.now()+seconds*1000;
      save();render();return;
    }
    if(action==='add-rest'&&s&&s.rest){
      const r=s.rest;
      if(r.paused)r.left=Math.min(1200,r.left+30);
      else{const next=remaining(r)+30;r.until=Date.now()+Math.min(1200,next)*1000;}
      save();render();return;
    }
    if(action==='skip-rest'&&s){s.rest=null;save();render();return;}
    if(action==='toggle-rest'&&s)return toggleClock('rest');
    if(action==='start-tread'&&s&&step?.type==='tread')return startClock('timer',step.id,step.minutes*60);
    if(action==='toggle-tread'&&s)return toggleClock('timer');
    if(action==='restart-tread'&&s&&step?.type==='tread')return startClock('timer',step.id,step.minutes*60);
    if(action==='start-plank-timer'&&s&&step?.type==='strength'&&timedExercise(step.id)&&!s.rest){
      const duration=Number($('#reps')?.value??step.draftReps);
      if(!Number.isInteger(duration)||duration<1||duration>300){toast('Enter a hold duration from 1 to 300 seconds');return;}
      step.draftReps=duration;startClock('timer',step.id,duration);return;
    }
    if(action==='toggle-plank-timer'&&s&&s.timer?.stepId===step?.id&&timedExercise(step.id))return toggleClock('timer');
    if(action==='reset-plank-timer'&&s&&s.timer?.stepId===step?.id&&timedExercise(step.id)){
      s.timer=null;save();render();return;
    }
    if(action==='walk-effort'&&s&&step?.id==='cardio'){
      const effort=el.dataset.effort;
      if(!['easy','good','hard'].includes(effort))return;
      const minutes=$('#walk-minutes')?.value,incline=$('#walk-incline')?.value,speed=$('#walk-speed')?.value;
      if(minutes!==undefined&&incline!==undefined)step.actual={minutes,incline,speed};
      step.walkEffort=effort;save();render();return;
    }
    if(action==='done-tread'&&s&&step?.type==='tread'){
      if(step.id==='cardio'){
        const minuteText=$('#walk-minutes')?.value.trim(),inclineText=$('#walk-incline')?.value.trim(),speedText=$('#walk-speed')?.value.trim();
        const minutes=Number(minuteText),incline=Number(inclineText),speed=speedText===''?null:Number(speedText);
        if(!minuteText||!Number.isInteger(minutes)||minutes<1||minutes>120){toast('Enter 1–120 walking minutes');return;}
        if(!inclineText||!Number.isFinite(incline)||incline<0||incline>30){toast('Enter a valid incline from 0–30%');return;}
        if(speed!==null&&(!Number.isFinite(speed)||speed<0.5||speed>25)){toast('Check the treadmill speed');return;}
        step.actual={minutes,incline,speed,effort:step.walkEffort||null};
      }
      step.done=true;s.timer=null;save();return getStepAfter();
    }
    if(action==='prev'&&s&&s.stepIndex>0){s.stepIndex--;s.rest=null;s.timer=null;s.exerciseBreak=null;save();render();scrollTop();return;}
    if(action==='skip'&&s){if(!confirm(`Skip ${step.title}? You can return to it from the workout list.`))return;step.skipped=true;s.rest=null;s.timer=null;s.exerciseBreak=null;return getStepAfter();}
    if(action==='jump'&&s){s.stepIndex=Number(el.dataset.step);s.rest=null;s.timer=null;s.exerciseBreak=null;save();render();scrollTop();return;}
    if(action==='end'&&s){if(!confirm('Finish and save this workout now, even if it is incomplete?'))return;finishWorkout();return;}
    if(action==='toggle-measure'){showMeasureForm=!showMeasureForm;render();return;}
    if(action==='save-measure'){const a=$('#bodyweight').value,b=$('#waist').value;if(!a&&!b){toast('Enter a weight or waist measurement');return;}if((a&&(Number(a)<20||Number(a)>400))||(b&&(Number(b)<20||Number(b)>250))){toast('Please check the values');return;}state.measurements.push({date:localDate(),weight:a?Number(a):null,waist:b?Number(b):null});save();showMeasureForm=false;render();toast('Measurement saved');return;}
    if(action==='delete-history'){if(!confirm('Delete this workout permanently? A local recovery copy will be kept.'))return;if(!createSafetyCopy('Before deleting a workout')){toast('Recovery copy failed; workout not deleted');return;}state.sessions=state.sessions.filter(x=>x.id!==el.dataset.id);expandedHistory=null;editingHistory=null;save();render();return;}
    if(action==='download-safety-copy'){
      const copy=safetyCopyInfo();
      if(!copy){toast('No recovery copy available');return;}
      downloadBackupData({app:'REPS',version:2,exportedAt:new Date(copy.createdAt).toISOString(),...copy.data},'reps-safety-copy-'+localDate(new Date(copy.createdAt))+'.json');
      toast('Recovery copy download started');return;
    }
    if(action==='restore-safety-copy'){
      const copy=safetyCopyInfo();
      if(!copy)return;
      if(!confirm('Restore the local safety copy from '+new Date(copy.createdAt).toLocaleString('en-GB')+'? It replaces current progress on this device. Download a backup first if needed.'))return;
      // Check the snapshot and save the current data first so this can be reversed.
      const replacement=copy.data;
      if(!Array.isArray(replacement.sessions)||!replacement.settings||!replacement.weights||!createSafetyCopy('Before restoring a recovery copy')){toast('Could not safely restore');return;}
      state=replacement;editingHistory=null;expandedHistory=null;save();render();toast('Safety copy restored');return;
    }
    if(action==='export'||action==='share-backup'){
      const data=JSON.stringify({app:'REPS',version:2,exportedAt:new Date().toISOString(),...state},null,2);
      const filename=`reps-backup-${localDate()}.json`;
      if(action==='share-backup'&&navigator.share&&typeof File!=='undefined'){
        const file=new File([data],filename,{type:'application/json'});
        if(!navigator.canShare||navigator.canShare({files:[file]})){
          navigator.share({files:[file],title:'REPS workout backup'}).then(()=>{
            state.lastBackupAt=Date.now();save();render();
          }).catch(()=>toast('Sharing cancelled — no data changed'));
          return;
        }
      }
      downloadBackupData(JSON.parse(data),filename);
      state.lastBackupAt=Date.now();save();render();
      toast(action==='share-backup'?'Downloaded backup — you can upload it to Drive':'Backup downloaded');return;
    }
  }
  document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){e.preventDefault();if(view==='today'&&state.active&&n.dataset.nav!=='today'){for(const kind of ['rest','timer','exerciseBreak']){const t=state.active[kind];if(t&&!t.paused){t.left=remaining(t);t.paused=true;}}save();}view=n.dataset.nav;if(view!=='history')justFinishedId=null;render();scrollTop();return;}const p=e.target.closest('[data-plan]');if(p){planTab=p.dataset.plan;render();return;}const h=e.target.closest('[data-history]');if(h){expandedHistory=expandedHistory===h.dataset.history?null:h.dataset.history;editingHistory=null;render();return;}const a=e.target.closest('[data-action]');if(a){handleAction(a.dataset.action,a);return;}});
  document.addEventListener('change',async e=>{const el=e.target;if(el.matches('#progress-exercise')){
    if(EXERCISES[el.value]){chartExercise=el.value;render();}return;
  }if(el.matches('[data-setting]')){const key=el.dataset.setting;const isBool=el.type==='checkbox';let value=isBool?el.checked:Number(el.value);if(!isBool){const min=Number(el.min),max=Number(el.max);if(!Number.isFinite(value))value=state.settings[key];value=Math.min(max,Math.max(min,value));}state.settings[key]=value;save();render();toast('Settings saved');return;}if(el.matches('[data-plan-sets]')){
      const id=el.dataset.planSets,variant=el.dataset.variant;
      const raw=el.value.trim(),n=Number(raw);
      if(!PLANS[variant]?.includes(id)||raw===''||!Number.isInteger(n)||n<1||n>6){
        toast('Enter 1–6 sets');render();return;
      }
      state.planSets[variant]={...(state.planSets[variant]||{}),[id]:n};
      save();render();toast('Workout '+variant+': '+n+' sets saved');return;
    }
    if(el.matches('[data-plan-weight], [data-plan-reps]')){
      const isWeight=el.hasAttribute('data-plan-weight');
      const id=isWeight?el.dataset.planWeight:el.dataset.planReps;
      if(!EXERCISES[id])return;
      const val=el.value.trim(), n=Number(val);
      if(isWeight?(val!==''&&(!Number.isFinite(n)||n<0||n>1000)):(!Number.isInteger(n)||n<1||n>(timedExercise(id)?300:100))){
        toast('Check the weight or reps value');render();return;
      }
      state.planned[id]={...(state.planned[id]||{}),[isWeight?'weight':'reps']:isWeight&&val===''?'':n};
      save();render();toast('Workout target saved');return;
    }
    if(el.matches('[data-weight]')){const val=el.value.trim();if(val!==''&&(!Number.isFinite(Number(val))||Number(val)<0||Number(val)>1000)){toast('Please enter a valid weight');render();return;}state.weights[el.dataset.weight]=val===''?'':Number(val);save();return;}if(el.matches('#importFile')&&el.files?.length){try{const raw=await el.files[0].text(),obj=JSON.parse(raw);if(obj.app!=='REPS'||!Array.isArray(obj.sessions)||!obj.settings||!obj.weights){toast('Not a valid REPS backup');return;}if(!confirm('Importing replaces current progress on this device. A local recovery copy will be kept. Continue?'))return;if(!createSafetyCopy('Before importing a backup')){toast('Cannot create recovery copy; import cancelled');return;}const d=DEFAULT();state={settings:{...d.settings,...Object.fromEntries(Object.entries(obj.settings).filter(([key])=>key!=='comeback'))},weights:{...d.weights,...obj.weights},planned:obj.planned&&typeof obj.planned==='object'?obj.planned:{},planSets:{A:{...(obj.planSets?.A||{})},B:{...(obj.planSets?.B||{})}},threeSetDefaultsApplied:obj.threeSetDefaultsApplied===true,checkins:obj.checkins&&typeof obj.checkins==='object'?obj.checkins:{},proteinDays:obj.proteinDays&&typeof obj.proteinDays==='object'?obj.proteinDays:{},
        exerciseNotes:obj.exerciseNotes&&typeof obj.exerciseNotes==='object'?obj.exerciseNotes:{},
        lastBackupAt:Number(obj.lastBackupAt)||0,backupRemindedAt:Number(obj.backupRemindedAt)||0,sessions:obj.sessions,measurements:Array.isArray(obj.measurements)?obj.measurements:[],active:obj.active&&Array.isArray(obj.active.steps)?obj.active:null};upgradeThreeSetDefaults();save();render();toast('Backup restored');}catch{toast('Could not read this backup file');}}});
  document.addEventListener('input',e=>{
    if(e.target.matches('[data-exercise-note]')){
      const id=e.target.dataset.exerciseNote;
      if(EXERCISES[id]){state.exerciseNotes[id]=e.target.value.slice(0,240);save();}
      return;
    }
    const step=stepData();if(state.active&&step?.type==='strength'){if(e.target.id==='weight'){step.draftWeight=e.target.value;save();}if(e.target.id==='reps'){step.draftReps=e.target.value;save();}}});
  window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['today','plan','coach','history','settings'].includes(v)){view=v;render();}});
  document.addEventListener('visibilitychange',()=>syncWakeLock());
  if(['today','plan','coach','history','settings'].includes(location.hash.slice(1)))view=location.hash.slice(1);
  if(upgradeThreeSetDefaults())save();
  render();timerTick=setInterval(tick,300);
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  </script>
</body>
</html>
